name: Document Loader Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install actual application runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.txt
      - name: Execute real document parser integration tests
        env:
          IYRIN_INTEGRATION_TESTS: '1'
        run: python -m unittest discover -s tests -p 'test_document_loader_integration.py' -v
