name: Audit Application Execution Paths

on:
  push:
    branches:
      - main
      - audit/roe-full-revalidation-pr80-pr84
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit tools
        run: python -m pip install pyflakes requests beautifulsoup4
      - name: Compile repository
        run: python -m compileall -q .
      - name: Test clean database bootstrap and source dispatch
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit undefined names
        shell: bash
        run: |
          set -o pipefail
          pyflakes app.py mapping.py storage.py embedders.py processors.py loaders.py fetchers.py generators.py 2>&1 | tee pyflakes.log || true
          if grep -E "undefined name|referenced before assignment" pyflakes.log; then
            exit 1
          fi
      - name: Enforce fetchers coding contracts
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          errors = []
          for filename in ('fetchers.py', 'generators.py', 'loaders.py', 'processors.py', 'realtime.py', 'sources.py', 'embedders.py', 'mapping.py', 'storage.py', 'excel.py', 'rates.py'):
              tree = ast.parse(Path(filename).read_text(encoding='utf-8'))
              for cls in (node for node in tree.body if isinstance(node, ast.ClassDef)):
                  if not ast.get_docstring(cls):
                      errors.append(f'{cls.name}:{cls.lineno}: missing class docstring')
                  for fn in (node for node in cls.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))):
                      if fn.name.startswith('_') and not (fn.name.startswith('__') and fn.name.endswith('__')):
                          errors.append(f'{cls.name}.{fn.name}:{fn.lineno}: forbidden method prefix')
                      if not ast.get_docstring(fn):
                          errors.append(f'{cls.name}.{fn.name}:{fn.lineno}: missing method docstring')
                      if fn.name.startswith('__') and fn.name.endswith('__'):
                          continue
                      if any(isinstance(node, ast.Raise) and isinstance(node.exc, ast.Call)
                             and isinstance(node.exc.func, ast.Name)
                             and node.exc.func.id == 'NotImplementedError' for node in ast.walk(fn)) or any(
                             isinstance(node, ast.Raise) and isinstance(node.exc, ast.Name)
                             and node.exc.id == 'NotImplementedError' for node in ast.walk(fn)):
                          continue
                      args = fn.args.posonlyargs + fn.args.args
                      required = args[:len(args) - len(fn.args.defaults)]
                      required += [arg for arg, default in zip(fn.args.kwonlyargs, fn.args.kw_defaults) if default is None]
                      necessary = [arg.arg for arg in required
                                   if arg.arg not in ('self', 'cls')
                                   and arg.annotation is not None
                                   and ast.unparse(arg.annotation) != 'Any'
                                   and '| None' not in ast.unparse(arg.annotation)
                                   and 'Optional[' not in ast.unparse(arg.annotation)]
                      guarded = {node.args[0].value for node in ast.walk(fn)
                                 if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
                                 and node.func.id == 'throw_if' and node.args
                                 and isinstance(node.args[0], ast.Constant) and isinstance(node.args[0].value, str)}
                      for arg in necessary:
                          if arg not in guarded:
                              errors.append(f'{cls.name}.{fn.name}:{fn.lineno}: missing throw_if for {arg}')
          print(f'fetchers.py/generators.py: {len(errors)} coding contract violations')
          for error in errors:
              print(error)
          if errors:
              raise SystemExit(1)
          PY
      - name: Enforce reviewed Python file coding invariants
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              'fetchers.py', 'generators.py', 'loaders.py', 'processors.py',
              'history.py', 'realtime.py', 'sources.py', 'tools.py',
              'embedders.py', 'mapping.py', 'storage.py', 'excel.py', 'rates.py',
          ]
          errors = []
          checked_functions = 0
          for name in files:
              tree = ast.parse(Path(name).read_text(encoding='utf-8'), filename=name)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                      if node.func.id in ('hasattr', 'getattr'):
                          errors.append(f'{name}:{node.lineno}: prohibited reflection {node.func.id}')
                  if isinstance(node, ast.ClassDef):
                      class_doc = ast.get_docstring(node) or ''
                      if 'Purpose:' not in class_doc or 'Attributes:' not in class_doc:
                          errors.append(f'{name}:{node.lineno}: missing class documentation')
                      for decorator in node.decorator_list:
                          if isinstance(decorator, ast.Name) and decorator.id == 'dataclass':
                              errors.append(f'{name}:{node.lineno}: prohibited dataclass')
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  checked_functions += 1
                  if node.args.vararg is not None or node.args.kwarg is not None:
                      errors.append(f'{name}:{node.lineno}: variadic function definition {node.name}')
                  if node.returns is None:
                      errors.append(f'{name}:{node.lineno}: missing return annotation {node.name}')
                  for arg in node.args.posonlyargs + node.args.args + node.args.kwonlyargs:
                      if arg.arg not in ('self', 'cls') and arg.annotation is None:
                          errors.append(f'{name}:{node.lineno}: missing argument annotation {node.name}.{arg.arg}')
                  if not ast.get_docstring(node):
                      errors.append(f'{name}:{node.lineno}: missing function documentation {node.name}')
          print(f'Checked {len(files)} production files and {checked_functions} functions.')
          for error in errors:
              print(error)
          if errors:
              raise SystemExit(f'{len(errors)} coding violations remain.')
          PY
      - name: Audit configured mode dispatch
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          config_text = Path('config.py').read_text(encoding='utf-8')
          app_text = Path('app.py').read_text(encoding='utf-8')
          module = ast.parse(config_text)
          modes = []
          for node in module.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'MODES':
                          modes = ast.literal_eval(node.value)
          missing = []
          for mode in modes:
              pattern = rf"(?:if|elif)\s+mode\s*==\s*['\"]{re.escape(mode)}['\"]"
              if not re.search(pattern, app_text):
                  missing.append(mode)
          if missing:
              raise SystemExit(f'Missing mode execution paths: {missing}')
          print(f'Validated {len(modes)} configured mode execution paths.')
          PY
      - name: Audit application processing boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')
          if 'from pipelines import' in app or 'from processing import' in app:
              raise SystemExit('Stale processing import found in app.py')
          required = {'chunk_documents', 'create_embeddings', 'store_documents',
                      'render_loading_tabs', 'render_web_document_processing'}
          defined = {node.name for node in ast.parse(app).body
                     if isinstance(node, ast.FunctionDef)}
          if missing := required - defined:
              raise SystemExit(f'Consolidated processing functions missing: {sorted(missing)}')
          print('Consolidated processing boundary OK.')
          PY
