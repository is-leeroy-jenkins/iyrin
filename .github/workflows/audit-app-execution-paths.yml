name: Audit Application Execution Paths

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit tools
        run: python -m pip install pyflakes
      - name: Compile repository
        run: python -m compileall -q .
      - name: Test clean database bootstrap and source dispatch
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit undefined names
        shell: bash
        run: |
          set -o pipefail
          pyflakes app.py pipelines.py processors.py loaders.py fetchers.py generators.py 2>&1 | tee pyflakes.log || true
          if grep -E "undefined name|referenced before assignment" pyflakes.log; then
            exit 1
          fi
      - name: Audit configured mode dispatch
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          config_text = Path('config.py').read_text(encoding='utf-8')
          app_text = Path('app.py').read_text(encoding='utf-8')
          module = ast.parse(config_text)
          modes = []
          for node in module.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'MODES':
                          modes = ast.literal_eval(node.value)
          missing = []
          for mode in modes:
              pattern = rf"(?:if|elif)\s+mode\s*==\s*['\"]{re.escape(mode)}['\"]"
              if not re.search(pattern, app_text):
                  missing.append(mode)
          if missing:
              raise SystemExit(f'Missing mode execution paths: {missing}')
          print(f'Validated {len(modes)} configured mode execution paths.')
          PY
      - name: Audit application processing boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          if 'from processing import' in app:
              raise SystemExit('Stale processing.py import found in app.py')
          if 'from pipelines import' not in app:
              raise SystemExit('pipelines.py import boundary missing from app.py')
          print('Processing boundary OK.')
          PY
